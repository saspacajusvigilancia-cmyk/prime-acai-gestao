name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: acai-gestao/package-lock.json
      - name: Install dependencies
        working-directory: acai-gestao
        run: npm ci
      - name: Run unit tests
        working-directory: acai-gestao
        run: npm test
      - name: Validate database migrations
        working-directory: acai-gestao
        run: npm run validar:migracoes
      - name: Build production bundle
        working-directory: acai-gestao
        run: npm run build
